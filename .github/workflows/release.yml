name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: dedicated-dungeons

      - name: Resolve U-API source
        id: uapi
        working-directory: dedicated-dungeons
        shell: bash
        env:
          U_API_REPOSITORY: ${{ vars.U_API_REPOSITORY }}
          U_API_REF: ${{ vars.U_API_REF }}
        run: |
          set -euo pipefail
          uapi_version="$(sed -n 's/^u_api_version=//p' gradle.properties)"
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          test -n "${uapi_version}" && test -n "${minecraft_version}"
          echo "repository=${U_API_REPOSITORY:-${GITHUB_REPOSITORY_OWNER}/u-api}" >> "${GITHUB_OUTPUT}"
          echo "ref=${U_API_REF:-v${uapi_version}+mc${minecraft_version}}" >> "${GITHUB_OUTPUT}"

      - name: Checkout required U-API
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.uapi.outputs.repository }}
          ref: ${{ steps.uapi.outputs.ref }}
          path: u-api
          token: ${{ secrets.U_API_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag and project metadata
        id: meta
        working-directory: dedicated-dungeons
        shell: bash
        run: |
          set -euo pipefail
          prop() {
            local value
            value="$(sed -n "s/^$1=//p" gradle.properties | head -n 1)"
            test -n "${value}" || { echo "Missing gradle.properties key: $1" >&2; exit 1; }
            printf '%s' "${value}"
          }
          mod_version="$(prop mod_version)"
          minecraft_version="$(prop minecraft_version)"
          mod_name="$(prop mod_name)"
          release_remote="$(prop release_remote)"
          [[ "${mod_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          [[ "${minecraft_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${release_remote}" == "origin" ]]
          expected_tag="v${mod_version}+mc${minecraft_version}"
          [[ "${GITHUB_REF_NAME}" == "${expected_tag}" ]] || {
            echo "Tag '${GITHUB_REF_NAME}' does not match '${expected_tag}'." >&2
            exit 1
          }
          if [[ "${mod_version}" == *-alpha* ]]; then
            channel=alpha; prerelease=true; featured=false
          elif [[ "${mod_version}" == *-beta* || "${mod_version}" == *-rc* ]]; then
            channel=beta; prerelease=true; featured=false
          else
            channel=release; prerelease=false; featured=true
          fi
          {
            echo "mod_version=${mod_version}"
            echo "minecraft_version=${minecraft_version}"
            echo "mod_name=${mod_name}"
            echo "channel=${channel}"
            echo "prerelease=${prerelease}"
            echo "featured=${featured}"
            echo "version_number=${mod_version}+mc${minecraft_version}"
            echo "title=${mod_name} ${mod_version} for Minecraft ${minecraft_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate publishing configuration
        id: publishing
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          U_API_MODRINTH_PROJECT_ID: ${{ vars.U_API_MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          U_API_CURSEFORGE_PROJECT_ID: ${{ vars.U_API_CURSEFORGE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "${MODRINTH_TOKEN}" || { echo "Missing MODRINTH_TOKEN" >&2; exit 1; }
          test -n "${MODRINTH_PROJECT_ID}" || { echo "Missing MODRINTH_PROJECT_ID" >&2; exit 1; }
          test -n "${U_API_MODRINTH_PROJECT_ID}" || { echo "Missing U_API_MODRINTH_PROJECT_ID" >&2; exit 1; }
          curseforge=false
          if [[ -n "${CURSEFORGE_TOKEN}" || -n "${CURSEFORGE_PROJECT_ID}" ]]; then
            test -n "${CURSEFORGE_TOKEN}" || { echo "CURSEFORGE_PROJECT_ID is set but CURSEFORGE_TOKEN is missing" >&2; exit 1; }
            test -n "${CURSEFORGE_PROJECT_ID}" || { echo "CURSEFORGE_TOKEN is set but CURSEFORGE_PROJECT_ID is missing" >&2; exit 1; }
            test -n "${U_API_CURSEFORGE_PROJECT_ID}" || { echo "Missing U_API_CURSEFORGE_PROJECT_ID" >&2; exit 1; }
            curseforge=true
          fi
          echo "curseforge=${curseforge}" >> "${GITHUB_OUTPUT}"

      - name: Clean release build
        working-directory: dedicated-dungeons
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Puse_local_u_api=true clean build

      - name: Run NeoForge GameTests
        working-directory: dedicated-dungeons
        run: ./gradlew --no-daemon -Puse_local_u_api=true runGameTestServer

      - name: Select exactly one distribution JAR
        id: artifact
        working-directory: dedicated-dungeons
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'dedicated-dungeons-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort)
          [[ "${#jars[@]}" -eq 1 ]] || { printf 'Expected one user JAR, found:\n%s\n' "${jars[*]}" >&2; exit 1; }
          [[ -s "${jars[0]}" ]]
          echo "path=dedicated-dungeons/${jars[0]}" >> "${GITHUB_OUTPUT}"
          echo "name=$(basename "${jars[0]}")" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes
        working-directory: dedicated-dungeons
        shell: bash
        env:
          MOD_VERSION: ${{ steps.meta.outputs.mod_version }}
          MINECRAFT_VERSION: ${{ steps.meta.outputs.minecraft_version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re, subprocess
          root = pathlib.Path(".")
          version = os.environ["MOD_VERSION"]
          minecraft = os.environ["MINECRAFT_VERSION"]
          tag = os.environ["TAG_NAME"]

          def changelog_section():
              path = root / "CHANGELOG.md"
              if not path.exists():
                  return None
              lines = path.read_text(encoding="utf-8").splitlines()
              header = re.compile(rf"^##\s+(?:\[\s*)?{re.escape(version)}(?:\s*\])?(?:\s+-.*)?\s*$")
              start = next((i for i, line in enumerate(lines) if header.match(line.strip())), None)
              if start is None:
                  return None
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
              return "\n".join(lines[start + 1:end]).strip() or None

          def version_file():
              path = root / "changelog" / f"{version}.md"
              return path.read_text(encoding="utf-8").strip() if path.exists() else None

          def commits():
              tags = subprocess.run(
                  ["git", "tag", "--list", f"v*+mc{minecraft}", "--sort=-creatordate"],
                  check=True, text=True, stdout=subprocess.PIPE).stdout.splitlines()
              previous = next((candidate for candidate in tags if candidate and candidate != tag), None)
              commit_range = f"{previous}..HEAD" if previous else "HEAD"
              messages = subprocess.run(
                  ["git", "log", "--no-merges", "--pretty=format:%s", commit_range],
                  check=True, text=True, stdout=subprocess.PIPE).stdout.splitlines()
              messages = [message.strip() for message in messages if message.strip()]
              if not messages:
                  raise SystemExit("Release notes cannot be formed")
              return "## Changes\n\n" + "\n".join(f"- {message}" for message in messages)

          notes = changelog_section() or version_file() or commits()
          notes += (
              "\n\n## Compatibility\n\n"
              f"- Minecraft: {minecraft}\n"
              "- Loader: NeoForge\n"
              "- Java: 21\n"
              "- Requires: U-API 2.0.0 or newer in the 2.x line\n"
          )
          (root / "release_notes.md").write_text(notes.rstrip() + "\n", encoding="utf-8")
          PY
          test -s release_notes.md

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: ${{ steps.meta.outputs.featured }}
          modrinth-dependencies: |
            ${{ vars.U_API_MODRINTH_PROJECT_ID }}(required)
          files: ${{ steps.artifact.outputs.path }}
          name: ${{ steps.meta.outputs.title }}
          version: ${{ steps.meta.outputs.version_number }}
          version-type: ${{ steps.meta.outputs.channel }}
          changelog-file: dedicated-dungeons/release_notes.md
          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.minecraft_version }}
          java: 21

      - name: Publish to CurseForge
        if: steps.publishing.outputs.curseforge == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-dependencies: |
            ${{ vars.U_API_CURSEFORGE_PROJECT_ID }}(required)
          files: ${{ steps.artifact.outputs.path }}
          name: ${{ steps.meta.outputs.title }}
          version: ${{ steps.meta.outputs.version_number }}
          version-type: ${{ steps.meta.outputs.channel }}
          changelog-file: dedicated-dungeons/release_notes.md
          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.minecraft_version }}
          java: 21

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.title }}
          body_path: dedicated-dungeons/release_notes.md
          files: ${{ steps.artifact.outputs.path }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          draft: false

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Dedicated Dungeons release"
            echo "- Tag: ${{ github.ref_name }}"
            echo "- Channel: ${{ steps.meta.outputs.channel || 'unresolved' }}"
            echo "- Artifact: ${{ steps.artifact.outputs.name || 'not selected' }}"
            echo "- Modrinth: required"
            echo "- CurseForge configured: ${{ steps.publishing.outputs.curseforge || 'false' }}"
            echo "- GitHub Release: created only after required publication"
          } >> "${GITHUB_STEP_SUMMARY}"
